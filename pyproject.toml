[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitmux"
version = "0.1.0"
description = "Manage multiple git repositories with ease"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ryan" }]
keywords = ["git", "multi-repo", "cli", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.15.4",
    "rich>=13.9.4",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "ruff==0.11.12",
]

[project.scripts]
gitmux = "gitmux.cli:app"

[project.urls]
Homepage = "https://github.com/ryan/gitmux"
Repository = "https://github.com/ryan/gitmux"
Issues = "https://github.com/ryan/gitmux/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gitmux"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gitmux"]
